<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinVision Pro Master</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f8f9ff',
              100: '#f1f3fe',
              200: '#e2e7ff',
              300: '#c6cefe',
              400: '#a3adfd',
              500: '#7a86f9',
              600: '#5865f2', // Cleaner indigo/blue
              700: '#4a54d4',
              800: '#3d45ae',
              900: '#353c8b',
              950: '#1f2252',
            },
            surface: {
              50: '#fafafa',
              100: '#f5f5f5',
              200: '#eeeeee',
            }
          },
          borderRadius: {
            '3xl': '1.5rem',
            '4xl': '2rem',
            '5xl': '2.5rem',
          },
          boxShadow: {
            'soft': '0 2px 15px -3px rgba(0, 0, 0, 0.07), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
            'soft-lg': '0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.04)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #fcfcfc;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .glass {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .card-minimal {
      @apply bg-white border border-slate-100 rounded-2xl shadow-soft transition-all duration-300 hover:shadow-soft-lg hover:border-slate-200;
    }

    .text-balance {
      text-wrap: balance;
    }

    /* Refined Typography */
    h1,
    h2,
    h3,
    h4 {
      @apply tracking-tight text-slate-900;
      letter-spacing: -0.02em;
    }

    .font-heavy {
      font-weight: 800;
    }

    .font-semibold {
      font-weight: 600;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
