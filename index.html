<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinVision Pro Master</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FinVision Pro">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Outfit"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f4ff',
              100: '#e1e9ff',
              200: '#c7d6ff',
              300: '#a1bbff',
              400: '#7395ff',
              500: '#4a69ff',
              600: '#2d43ff',
              700: '#212fff',
              800: '#1d2ae6',
              900: '#1e28b8',
              950: '#12166b',
            },
          },
          animation: {
            'scan': 'scan 2s linear infinite',
            'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            scan: {
              '0%': { transform: 'translateY(-100%)', opacity: '0' },
              '50%': { opacity: '1' },
              '100%': { transform: 'translateY(100%)', opacity: '0' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .clip-path-half {
      clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
    }

    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .dark .glass {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .text-gradient {
      background: linear-gradient(to right, #4a69ff, #212fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card-premium {
      @apply transition-all duration-300 hover:shadow-2xl hover:shadow-brand-500/10 hover:-translate-y-1;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    // Register Service Worker inline — no separate file needed (bypasses Vercel routing)
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE = 'finvision-v1';
        const SHELL = ['/'];

        self.addEventListener('install', e => {
          e.waitUntil(caches.open(CACHE).then(c => c.addAll(SHELL)));
          self.skipWaiting();
        });

        self.addEventListener('activate', e => {
          e.waitUntil(
            caches.keys().then(ks => Promise.all(ks.filter(k => k !== CACHE).map(k => caches.delete(k))))
          );
          self.clients.claim();
        });

        self.addEventListener('fetch', e => {
          const url = new URL(e.request.url);
          if (e.request.method !== 'GET' || url.protocol === 'chrome-extension:') return;

          // Supabase: network-first, fallback empty JSON when offline
          if (url.hostname.includes('supabase.co')) {
            e.respondWith(fetch(e.request).catch(() => new Response(
              JSON.stringify({ data: null, error: { message: 'Offline' } }),
              { headers: { 'Content-Type': 'application/json' } }
            )));
            return;
          }

          // Static assets: cache-first
          e.respondWith(
            caches.match(e.request).then(cached => {
              if (cached) return cached;
              return fetch(e.request).then(res => {
                if (res.ok) {
                  const clone = res.clone();
                  caches.open(CACHE).then(c => c.put(e.request, clone));
                }
                return res;
              }).catch(() => caches.match('/'));
            })
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      window.addEventListener('load', () => {
        navigator.serviceWorker.register(swUrl, { scope: '/' })
          .then(reg => console.log('[SW] Registered via blob:', reg.scope))
          .catch(err => console.warn('[SW] Registration failed:', err));
      });
    }
  </script>
</body>

</html>
