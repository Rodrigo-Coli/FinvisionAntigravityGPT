<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>FinVision Pro</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="alternate icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/logo.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/logo.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/logo.png">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinVision Pro">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="FinVision Pro">
  <meta name="msapplication-TileColor" content="#4f46e5">
  <meta name="msapplication-TileImage" content="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Outfit"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f4ff',
              100: '#e1e9ff',
              200: '#c7d6ff',
              300: '#a1bbff',
              400: '#7395ff',
              500: '#4a69ff',
              600: '#2d43ff',
              700: '#212fff',
              800: '#1d2ae6',
              900: '#1e28b8',
              950: '#12166b',
            },
          },
          animation: {
            'scan': 'scan 2s linear infinite',
            'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            scan: {
              '0%': { transform: 'translateY(-100%)', opacity: '0' },
              '50%': { opacity: '1' },
              '100%': { transform: 'translateY(100%)', opacity: '0' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Safe Area Padding Utilities */
    .pb-safe {
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px) !important;
    }
    
    .pt-safe {
      padding-top: env(safe-area-inset-top, 0px) !important;
    }

    .mobile-header-safe {
      height: calc(4rem + env(safe-area-inset-top, 0px)) !important;
      padding-top: env(safe-area-inset-top, 0px) !important;
    }

    .menu-overlay-safe {
      padding-top: calc(1.5rem + env(safe-area-inset-top, 0px)) !important;
    }
    
    .main-content-safe {
      padding-top: calc(4rem + env(safe-area-inset-top, 0px)) !important;
    }

    @media (min-width: 1024px) {
      .main-content-safe {
        padding-top: 0px !important;
      }
    }

    /* Prevent horizontal overflow on all elements (mobile fix) */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      /* instant scrollTo behavior so programmatic scroll resets work */
      scroll-behavior: auto;
      overflow-x: hidden;
      width: 100%;
      position: relative;
    }

    body {
      overflow-x: hidden;
      width: 100%;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }

    #root {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }

    /* Force all children of root to stay within bounds on mobile */
    @media (max-width: 768px) {
      #root * {
        max-width: 100%;
      }
      
      /* Allow scroll containers to keep their behavior */
      .overflow-x-auto, .overflow-auto {
        max-width: none !important;
      }
    }


    /* Utility: break long words to prevent overflow */
    .overflow-wrap-anywhere {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* No scrollbar on chat chips row */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .clip-path-half {
      clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
    }

    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .dark .glass {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .text-gradient {
      background: linear-gradient(to right, #4a69ff, #212fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card-premium {
      @apply transition-all duration-300 hover:shadow-2xl hover:shadow-brand-500/10 hover:-translate-y-1;
    }

    /* ========================================================
       PRINT STYLES - Extrato de Empréstimo / Asset Ledger
    ======================================================== */
    @media print {
      /* Hide everything except the extrato modal */
      body > #root > * { display: none !important; }

      /* Show and reset the extrato modal overlay */
      .fixed.inset-0.z-50 {
        display: flex !important;
        position: static !important;
        background: white !important;
        backdrop-filter: none !important;
      }

      /* Make the modal inner box full-page */
      .fixed.inset-0.z-50 > div {
        width: 100% !important;
        max-width: none !important;
        max-height: none !important;
        height: auto !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        overflow: visible !important;
      }

      /* Scrollable area expands to show all content */
      .flex-1.overflow-y-auto {
        overflow: visible !important;
        max-height: none !important;
      }

      /* Ensure tables render fully */
      table { page-break-inside: auto; }
      tr    { page-break-inside: avoid; page-break-after: auto; }

      /* Utility: hide elements during print */
      .print\:hidden { display: none !important; }
      .hidden.print\:block { display: block !important; }
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 antialiased">
  <div id="root"></div>
  <script>
    console.log("INDEX.HTML SCRIPT EXECUTING!");
    window.addEventListener('error', (event) => {
      document.body.innerHTML += '<div style="color:red;z-index:9999;position:absolute;top:0;">' + event.message + '</div>';
    });
    // Captura o evento de instalação PWA ANTES de qualquer outro código
    window.__pwaInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.__pwaInstallPrompt = e;
      // Dispara evento customizado para o React capturar
      window.dispatchEvent(new CustomEvent('pwa-installable'));
      console.log('[PWA] App instalável detectado!');
    });
    window.addEventListener('appinstalled', () => {
      window.__pwaInstallPrompt = null;
      console.log('[PWA] App instalado com sucesso!');
    });
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
