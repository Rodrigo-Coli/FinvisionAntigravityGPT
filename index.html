  <!--
    TRAFEGO PAGO: inserir aqui os scripts de Meta Pixel e Google Tag (GA4) quando os IDs

    Google Tag / GA4, ID substituido por SEU_MEASUREMENT_ID, script colado logo acima desta linha:

      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'SEU_MEASUREMENT_ID');
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--
    As fontes NÃO podem bloquear a primeira pintura.

    Como <link rel="stylesheet"> comum, o navegador se recusa a desenhar
    qualquer coisa até a folha de estilo do Google responder. Medimos isso: numa
    rede em que o fonts.googleapis.com não respondia, a tela ficou EM BRANCO por
    12,5 segundos antes de a requisição desistir — e num iPhone em 4G instável é
    exatamente esse o cenário de "o site demora para abrir".

    O truque do media="print" faz o navegador baixar a folha sem tratá-la como
    bloqueante; o onload devolve ela para todas as mídias assim que chega. Como a
    fonte já vem com `display=swap` e a pilha tem `sans-serif` de reserva, o
    texto aparece na hora e troca de fonte quando o arquivo chega. O <noscript>
    cobre quem estiver sem JavaScript.
  -->
  <link rel="stylesheet" media="print" onload="this.media='all'; this.onload=null;"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Outfit:wght@100..900&display=swap">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Outfit:wght@100..900&display=swap">

<body class="bg-slate-50 text-slate-900 antialiased">
  <div id="root"></div>
  <script>
    /*
     * NUNCA volte a escrever no HTML interno do <body> aqui.
     *
     * Existia um depurador nesta linha que ANEXAVA uma div de erro ao HTML
     * interno do body, lendo e reatribuindo a propriedade.
     *
     * Reatribuir esse HTML REPARSEIA o documento inteiro: todo
     * nó do DOM é destruído e recriado do zero. O React continua apontando para
     * os nós antigos (agora soltos) e perde o ponto onde escuta os cliques.
     * Visualmente a página fica igual — e absolutamente nada responde ao toque.
     *
     * No iPhone isso acontecia de cara: basta UM erro de script (um recurso de
     * terceiro, uma extensão, um aviso do próprio Safari) logo no início para o
     * site inteiro ficar "olhando mas não clicando", justamente enquanto o aviso
     * de instalar o app aparecia.
     *
     * O erro agora vai só para o console, que não mexe na página.
     */
    window.addEventListener('error', (event) => {
      console.error('[Zyvion] Erro nao tratado:', event.message, event.filename, event.lineno);
    });
    window.addEventListener('unhandledrejection', (event) => {
      console.error('[Zyvion] Promessa rejeitada sem tratamento:', event.reason);
    });
    // Captura o evento de instalação PWA ANTES de qualquer outro código
    window.__pwaInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.__pwaInstallPrompt = e;
      // Dispara evento customizado para o React capturar
      window.dispatchEvent(new CustomEvent('pwa-installable'));
      console.log('[PWA] App instalável detectado!');
    });
    window.addEventListener('appinstalled', () => {
      window.__pwaInstallPrompt = null;
      console.log('[PWA] App instalado com sucesso!');
    });
  </script>
  <script type="module" src="/index.tsx"></script>
</body>
